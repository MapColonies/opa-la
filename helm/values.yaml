global:
  cloudProvider: {}
  tracing: {}
  metrics: {}

configServerUrl: &configServerUrl 'http://localhost/api'
offlineMode: &configOfflineMode false

cloudProvider: &cloudProvider
  dockerRegistryUrl: my-registry-url.io
  imagePullSecretName: 'my-registry-secret'
  flavor: openshift

ca: &ca
  enabled: false
  secretName: 'root-ca'
  path: '/usr/local/share/ca-certificates'
  key: 'ca.crt'

host: &host ''
tls: &tls
  useCerts: false
  certificate: ''
  key: ''
  caCertificate: ''

# Grafana dashboards for this site. They show only this site's OPA pods:
# pods whose mapcolonies.io/environment matches global.mclabels.environment, split by the
# mapcolonies.io/opa-environment label that the opa chart sets from opaEnvironment.
# OPA releases deployed separately (opa.enabled only) must use the same global.mclabels.environment.
dashboards:
  enabled: true
  # Environment selected when a dashboard opens. Must be one of the enabled environments.
  defaultEnvironment: prod
  # Bundle environments served by this site's OPAs (np = development OPAs,
  # stage = staging, prod = production). Disable the ones this site doesn't serve.
  environments:
    np:
      enabled: true
      # UIDs of the Grafana datasources holding this environment's OPA metrics and decision logs
      prometheusDatasourceUid: prometheus
      lokiDatasourceUid: loki
      # OpenShift console of the cluster running this environment's OPAs, for pod links
      openshiftUrl: https://replace-me.com
    stage:
      enabled: true
      prometheusDatasourceUid: prometheus
      lokiDatasourceUid: loki
      openshiftUrl: https://replace-me.com
    prod:
      enabled: true
      prometheusDatasourceUid: prometheus
      lokiDatasourceUid: loki
      openshiftUrl: https://replace-me.com

grafana-datasources:
  enabled: true
  team: infra
  instance: opala
  datasources:
    postgres:
      - service: opala
        host: localhost:5432
        database: auth-manager
        username: postgres
        password: postgres
opa:
  enabled: true
  cloudProvider: *cloudProvider
  ca: *ca
  image:
    repository: openpolicyagent/opa

  bundlePersistencePath: /tmp/opa

  s3:
    endpoint: http://localhost:9000/opa
    secretName: s3-secret
    filePath: '/dev.tar.gz'

  hpa:
    enabled: true

  route:
    enabled: true
    host: *host
    path: /opa
    tls: *tls

  ingress:
    enabled: false
    className: ""
    labels: {}
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts: []
      # - host: opa.domain.com
      #   paths:
      #     - path: /
      #       pathType: ImplementationSpecific
    path: /
    # host: 'localhost'
    # cors:
    #   enabled: true
    #   origin: '*'
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - opa.domain.com

auth-cron:
  enabled: true
  cloudProvider: *cloudProvider
  ca: *ca
  image:
    repository: infra/auth-cron

  configManager:
    offlineMode: *configOfflineMode
    serverUrl: *configServerUrl
    name: 'infra-auth-cron'

auth-manager:
  enabled: true
  cloudProvider: *cloudProvider
  ca: *ca
  image:
    repository: infra/auth-manager

  configManager:
    offlineMode: *configOfflineMode
    serverUrl: *configServerUrl
    name: 'infra-auth-manager'

  route:
    enabled: true
    host: *host
    path: /api
    tls: *tls

  ingress:
    enabled: false
    className: ""
    labels: {}
    annotations: {}
    hosts: []
      # - host: opa.domain.com
      #   paths:
      #     - path: /
      #       pathType: ImplementationSpecific
    path: /
    # host: 'localhost'
    # cors:
    #   enabled: true
    #   origin: '*'
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - opa.domain.com

auth-ui:
  enabled: true
  config: |
    {}
  replicaCount: 1
  cloudProvider: *cloudProvider
  mclabels:
    owner: infra
    partOf: authentication
    component: frontend
    logScraping: false
    criticality: internal
  image:
    repository: infra/auth-ui
    tag: v2.1.0 # x-release-please-version
  resources:
    value:
      limits:
        cpu: 400m
      requests:
        cpu: 100m
  extraVolumes:
    - name: config
      configMap:
        name: '{{ .Release.Name }}-opa-la-configmap'
  extraVolumeMounts:
    - name: config
      mountPath: /etc/nginx/conf.d/extensions/extension.conf
      subPath: extension.conf
    - name: config
      mountPath: /usr/share/nginx/html/config.json
      subPath: config.json
  opentelemetry:
    ratio: 1
  nginx:
    extensions:
      location:
        enabled: true
        fileName: extension.conf
  authorization:
    enabled: false
  backend:
    enabled: false
  route:
    enabled: true
    routesMapping:
      - path: /
        host: *host
    tls: *tls

token-kiosk:
  enabled: true
  cloudProvider: *cloudProvider
  ca: *ca
  image:
    repository: infra/token-kiosk
  configManager:
    offlineMode: *configOfflineMode
    serverUrl: *configServerUrl
    name: 'infra-token-kiosk'

kiosk-ui:
  enabled: true
  replicaCount: 1
  cloudProvider: *cloudProvider
  mclabels:
    owner: infra
    partOf: authentication
    component: frontend
    logScraping: false
    criticality: internal
  image:
    repository: infra/kiosk-ui
    tag: v2.1.0 # x-release-please-version
  resources:
    value:
      limits:
        cpu: 400m
      requests:
        cpu: 100m
  extraVolumes:
    - name: config
      configMap:
        name: '{{ .Release.Name }}-opa-la-configmap'
  extraVolumeMounts:
    - name: config
      mountPath: /etc/nginx/conf.d/extensions/extension.conf
      subPath: extension.conf
  opentelemetry:
    ratio: 1
  nginx:
    extensions:
      location:
        enabled: true
        fileName: extension.conf
  authorization:
    enabled: false
  backend:
    enabled: false
  route:
    enabled: true
    routesMapping:
      - path: /
        host: *host
    tls: *tls
